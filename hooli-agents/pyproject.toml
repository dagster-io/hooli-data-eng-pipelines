[project]
name = "hooli_agents"
version = "0.1.0"
description = "Engineering agents for Hooli: a bug fixer, a PR reviewer and an improvement advisor"
requires-python = ">=3.11,<3.13"
dependencies = [
    "dagster==1.13.30",
    "dagster-cloud",
    "dagster-community-components",
    "fastmcp>=2.0",
    "requests",
    "slack-sdk",
]

[project.optional-dependencies]
dev = ["dagster-dg-cli", "dagster-webserver", "pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hooli_agents"]

[tool.dg]
directory_type = "project"

[tool.dg.project]
root_module = "hooli_agents"
code_location_name = "hooli_agents"
